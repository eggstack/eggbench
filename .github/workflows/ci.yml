name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  EGGBENCH_PARENT_SENTINEL_26CE: set-in-parent-process

jobs:
  linux-stable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked

  linux-msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked
      - run: cargo test -p eggbench-core --all-features --locked

  macos-stable:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - name: Qualify macOS process-group cleanup
        run: cargo test -p eggbench-runner --test lifecycle descendant_cleanup_reaches_process_group --locked
      - name: Qualify filesystem symlink confinement
        run: cargo test -p eggbench-runner --test lifecycle workspace_and_cwd_are_resolved_through_the_filesystem --locked

  windows-stable:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test -p eggbench-core --all-features --locked
      - run: cargo test -p eggbench-runner --test platform --locked
