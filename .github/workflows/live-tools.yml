name: Live external-tool qualification

# Post-M003 live-tool corrective (C002) interoperability job: executes the
# Eggbench M003 adapters against the REAL pinned sibling binaries
# (EggReplay @ d39f4b7, Eggprobe v0.1.1 schema 0.3 positive control plus the
# schema-0.4 negative control) and fails on any contract mismatch.
#
# Linux-only by design: the normal four-lane CI already qualifies Eggbench's
# platform-specific process/runtime behavior. This job proves
# machine-contract interoperability, not sibling platform portability.

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  EGGBENCH_PARENT_SENTINEL_26CE: set-in-parent-process

jobs:
  live-tools-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Eggbench release binary with all features
        run: cargo build --locked --release --all-features -p eggbench-cli
      - name: Run live external-tool qualification harness
        run: |
          set -u
          bash scripts/qualification/m003-live-tools/run-live-qualification.sh >live-qualification.log 2>&1
          rc=$?
          tail -45 live-qualification.log
          exit "$rc"
      - name: Upload bounded provenance and evidence summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-qualification-log
          path: live-qualification.log
          retention-days: 30

  live-eggsec-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Eggbench release binary with all features
        run: cargo build --locked --release --all-features -p eggbench-cli
      - name: Run M004a live Eggsec qualification harness
        run: |
          set -u
          bash scripts/qualification/m004a-eggsec/run-live-qualification.sh >live-eggsec-qualification.log 2>&1
          rc=$?
          tail -45 live-eggsec-qualification.log
          exit "$rc"
      - name: Upload bounded provenance and evidence summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-eggsec-qualification-log
          path: live-eggsec-qualification.log
          retention-days: 30

  live-m004b-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Eggbench release binary with all features
        run: cargo build --locked --release --all-features -p eggbench-cli
      - name: Run M004b combined-verdict qualification harness
        run: |
          set -u
          bash scripts/qualification/m004b-combined/run-live-qualification.sh >live-m004b-qualification.log 2>&1
          rc=$?
          tail -50 live-m004b-qualification.log
          exit "$rc"
      - name: Upload bounded provenance and evidence summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-m004b-qualification-log
          path: live-m004b-qualification.log
          retention-days: 30

  live-synvoid-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Eggbench release binary with all features
        run: cargo build --locked --release --all-features -p eggbench-cli
      # An absent oracle is reported NOT-EXECUTED so the rest of the evidence
      # still lands, which quietly means the independent-transport
      # corroboration is missing on exactly the machines nobody watches. Install
      # it from a pinned release asset with a verified digest so the claim is
      # actually exercised and the recorded digest names the bytes that ran.
      - name: Provision pinned external oracles
        run: bash scripts/qualification/provision-external-oracles.sh oha
      - name: Run M002a live SynVoid qualification harness
        run: |
          set -u
          bash scripts/qualification/synvoid-m002/run-live-qualification.sh >live-synvoid-qualification.log 2>&1
          rc=$?
          tail -50 live-synvoid-qualification.log
          exit "$rc"
      - name: Upload bounded provenance and evidence summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-synvoid-qualification-log
          path: live-synvoid-qualification.log
          retention-days: 30
      - name: Upload retained M002 stage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-synvoid-stage-diagnostics
          path: m002-live-diagnostics
          retention-days: 30

  # M003c/M003d terminal qualification: subject telemetry ingestion against the
  # real pinned SynVoid telemetry contract plus the Eggsec strict-scope load
  # profiles against the real pinned Eggsec binary. The harness materializes the
  # owner contracts from the pinned SynVoid tree, so a contract change upstream
  # fails this job rather than silently changing the evidence.
  live-m003-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Eggbench release binary with all features
        run: cargo build --locked --release --all-features -p eggbench-cli
      # An absent oracle is reported NOT-EXECUTED so the rest of the evidence
      # still lands, which quietly means the independent-transport
      # corroboration is missing on exactly the machines nobody watches. Install
      # it from a pinned release asset with a verified digest so the claim is
      # actually exercised and the recorded digest names the bytes that ran.
      - name: Provision pinned external oracles
        run: bash scripts/qualification/provision-external-oracles.sh oha
      - name: Run M003c/M003d live qualification harness
        run: |
          set -u
          EGGBENCH_BIN="$PWD/target/release/eggbench" \
            bash scripts/qualification/synvoid-m003/run-live-qualification.sh >live-m003-qualification.log 2>&1
          rc=$?
          tail -60 live-m003-qualification.log
          exit "$rc"
      - name: Upload bounded provenance and evidence summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-m003-qualification-log
          path: live-m003-qualification.log
          retention-days: 30
      # Stopped stages name the evidence that explains them, so that evidence
      # has to outlive the harness's temporary work directory.
      - name: Upload retained stage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-m003-stage-diagnostics
          path: m003-live-diagnostics
          if-no-files-found: warn
          retention-days: 30
