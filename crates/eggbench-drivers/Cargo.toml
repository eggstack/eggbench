[package]
name = "eggbench-drivers"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
external-command = []
eggstack-http = [
  "dep:eggfetch-core",
  "dep:eggserve-primitives",
  "dep:eggserve-server",
  "dep:hdrhistogram",
]
gregg = ["dep:eggfetch-core", "dep:gregg-protocol"]
eggstack-path = [
  "eggstack-http",
  "dep:eggress-outbound",
  "dep:eggress-uri",
  "dep:eggress-core",
  "dep:eggchaos-core",
]

[dependencies]
eggbench-core = { path = "../eggbench-core" }
eggbench-runner = { path = "../eggbench-runner" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
eggfetch-core = { version = "0.2", optional = true, default-features = false, features = [
  "standard-http1",
  "advanced-routing",
] }
gregg-protocol = { version = "1", optional = true }
eggserve-primitives = { version = "0.2", optional = true }
eggserve-server = { version = "0.2", optional = true }
hdrhistogram = { version = "7", optional = true, default-features = false, features = [
  "serialization",
] }
eggress-outbound = { version = "=1.0.10", optional = true, default-features = false }
eggress-uri = { version = "=1.0.10", optional = true }
eggress-core = { version = "=1.0.10", optional = true }
eggchaos-core = { version = "=0.1.0", optional = true }

[dev-dependencies]
eggress-embed = { version = "=1.0.10", default-features = false, features = [
  "common",
] }
tempfile = "3"
tokio = { workspace = true, features = ["net"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["process", "signal"] }

[lints]
workspace = true
