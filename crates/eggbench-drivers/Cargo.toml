[package]
name = "eggbench-drivers"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
external-command = []
eggstack-http = [
  "dep:eggfetch-core",
  "dep:eggserve-primitives",
  "dep:eggserve-server",
  "dep:hdrhistogram",
]

[dependencies]
eggbench-core = { path = "../eggbench-core" }
eggbench-runner = { path = "../eggbench-runner" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
eggfetch-core = { version = "0.2", optional = true, default-features = false, features = [
  "standard-http1",
] }
eggserve-primitives = { version = "0.2", optional = true }
eggserve-server = { version = "0.2", optional = true }
hdrhistogram = { version = "7", optional = true, default-features = false, features = [
  "serialization",
] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["process", "signal"] }

[lints]
workspace = true
