[package]
name = "eggbench-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "eggbench"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[features]
default = []
eggstack-http = ["eggbench-drivers/eggstack-http"]
gregg = ["eggbench-drivers/gregg"]

[dependencies]
eggbench-core = { path = "../eggbench-core" }
eggbench-drivers = { path = "../eggbench-drivers" }
eggbench-runner = { path = "../eggbench-runner" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
clap = { version = "4", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["process", "signal"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["net"] }

[lints]
workspace = true
