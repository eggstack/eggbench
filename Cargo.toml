[workspace]
members = ["crates/eggbench-cli", "crates/eggbench-core", "crates/eggbench-runner"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
uuid = { version = "1", features = ["serde", "v4"] }
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt", "rt-multi-thread", "signal"] }
tokio-util = { version = "0.7" }
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
