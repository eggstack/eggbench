[workspace]
members = ["crates/eggbench-cli", "crates/eggbench-core", "crates/eggbench-runner", "crates/eggbench-drivers"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
uuid = { version = "1", features = ["serde", "v4"] }
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt", "rt-multi-thread", "signal"] }
tokio-util = { version = "0.7" }
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# `assert_is_empty` arrived in clippy 1.99 and fires on the repository's
# idiomatic `assert!(x.is_empty())` assertions across roughly twenty existing
# test files. Adopting it everywhere is a mechanical cleanup unrelated to any
# milestone, and the lint has no security or contract value here: every such
# assertion already reports a message. It stays off until that cleanup lands,
# rather than being satisfied by allowing it file by file.
assert_is_empty = "allow"
